name: Setup development environment for trends.earth CLI
description: Install Python dependencies and configure development tools for the trends.earth CLI project

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --all-extras
          uv run pre-commit install

      - name: Verify installation
        run: |
          uv run trends --help
          uv run pytest --version
          uv run ruff --version
          uv run mypy --version
